name: Build Drone LSF binary

on:
  push:
    branches: [Drone_LSF]
  pull_request:
    branches: [Drone_LSF]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: RHEL 8 amd64 binary (CGO)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      GOOS: linux
      GOARCH: amd64
      # Required by the SQLite driver.
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: false

      # Keep JavaScript actions on the host; compile and test against UBI 8's
      # glibc 2.28, not the newer glibc supplied by the Ubuntu runner.
      - name: Build and verify in UBI 8
        run: |
          # Keep the output directory writable by the host packaging step.
          mkdir -p dist
          docker run --rm --platform linux/amd64 \
            -v "$PWD:/src" \
            -v "$(go env GOROOT):/usr/local/go:ro" \
            -w /src \
            -e PATH=/usr/local/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            -e GOOS -e GOARCH -e CGO_ENABLED \
            -e GOTOOLCHAIN=local \
            registry.access.redhat.com/ubi8/ubi:8.10 \
            bash -euxo pipefail -c '
              dnf install -y gcc glibc-devel binutils file git ca-certificates
              git config --global --add safe.directory /src
              bash scripts/build-rhel8.sh
              go test -mod=readonly ./store/repos ./monitor ./handler/api/monitor ./handler/web ./internal/pipelineruntime ./operator/runner ./cmd/drone-server
            '

      # UBI's public repositories do not provide tcsh. Run the LSF integration
      # tests on the host; the release binary above is still built only in UBI 8.
      - name: Prepare tcsh and legacy Git test client
        run: |
          sudo apt-get update
          sudo apt-get install -y tcsh build-essential libcurl4-openssl-dev libexpat1-dev zlib1g-dev
          bash scripts/build-test-git-1.8.3.1.sh "$RUNNER_TEMP/git-1.8.3.1"

      - name: Test LSF engine and HTTP clone compatibility
        env:
          DRONE_TEST_LEGACY_GIT: ${{ runner.temp }}/git-1.8.3.1/bin/git
        run: |
          go test -mod=readonly -race ./internal/pipelineruntime ./operator/runner/lsf ./operator/runner

      - name: Package binary
        working-directory: dist
        run: |
          tar -czf drone-server-linux-amd64.tar.gz drone-server
          sha256sum drone-server-linux-amd64.tar.gz > drone-server-linux-amd64.tar.gz.sha256

      - name: Upload binary
        uses: actions/upload-artifact@v6
        with:
          name: drone-server-linux-amd64-${{ github.sha }}
          path: |
            dist/drone-server-linux-amd64.tar.gz
            dist/drone-server-linux-amd64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
